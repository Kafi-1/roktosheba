<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Requests - RoktoSeva</title>
  <link rel="icon" href="../assets/favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="min-h-screen flex flex-col bg-[#070a13] text-white">
  <div id="navbar"></div>

  <main class="flex-1 relative py-12 px-4 sm:px-8">
    <div class="max-w-5xl mx-auto">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
        <div>
          <h1 class="text-3xl font-extrabold tracking-tight">My <span class="text-red-500">Requests</span></h1>
          <p class="text-slate-400 text-sm mt-1">Track your blood donation requests.</p>
        </div>
        <a href="create-request.html" class="px-5 py-2.5 bg-gradient-to-r from-red-600 to-rose-600 rounded-xl text-white font-bold text-sm uppercase tracking-wider hover:shadow-[0_0_20px_rgba(239,68,68,0.4)] transition-all text-center">
          + New Request
        </a>
      </div>

      <div id="requestsList" class="space-y-4">
        <!-- loaded by JS -->
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/common.js"></script>
  <script>
    const user = requireAuth();
    const listEl = document.getElementById("requestsList");
    listEl.innerHTML = loadingHTML();

    async function loadMyRequests() {
      const fb = await initFirebase();
      if (!fb) {
        listEl.innerHTML = emptyStateHTML(
          "Firebase is not configured. Add your keys to load your requests.",
          "create-request.html",
          "Create a request →"
        );
        return;
      }

      try {
        const { collection, getDocs, query, where } = await getFirestoreFns();
        const uid = user.uid || user.email;
        let snap;
        try {
          snap = await getDocs(
            query(collection(fb.db, "requests"), where("userId", "==", uid))
          );
        } catch (e) {
          // Fallback: get all and filter
          snap = await getDocs(collection(fb.db, "requests"));
        }

        const items = [];
        snap.forEach((docSnap) => {
          const d = docSnap.data();
          if (d.userId === uid || d.userId === user.email) {
            items.push({ id: docSnap.id, ...d });
          }
        });

        items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

        if (!items.length) {
          listEl.innerHTML = emptyStateHTML(
            "You have no active requests yet.",
            "create-request.html",
            "Create your first request →"
          );
          return;
        }

        listEl.innerHTML = items
          .map(
            (req) => `
          <div class="bg-[#0c101f]/70 border border-white/5 rounded-2xl p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-start gap-4">
              <div class="w-12 h-12 rounded-2xl bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-500 font-black text-lg shrink-0">
                ${req.bloodGroup || "—"}
              </div>
              <div>
                <h3 class="font-bold text-white">${req.patientName || "Patient"}</h3>
                <p class="text-xs text-slate-400 mt-1">🏥 ${req.hospital || "—"} · 📍 ${req.upazila || ""}${req.upazila && req.district ? ", " : ""}${req.district || ""}</p>
                <p class="text-xs text-slate-500 mt-1">📅 Needed: ${req.dateNeeded || "—"}</p>
              </div>
            </div>
            <span class="text-[10px] uppercase font-bold ${(req.status || "").toLowerCase() === "urgent" ? "text-red-400 bg-red-500/10 border-red-500/20" : "text-yellow-500 bg-yellow-500/10 border-yellow-500/20"} px-3 py-1.5 rounded-lg border self-start sm:self-center">
              ${req.status || "Pending"}
            </span>
          </div>
        `
          )
          .join("");
      } catch (err) {
        console.error(err);
        listEl.innerHTML = emptyStateHTML(
          "Could not load your requests. Check Firebase connection.",
          "create-request.html",
          "Create a request →"
        );
      }
    }

    loadMyRequests();
  </script>
</body>
</html>
