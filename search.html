<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Donors - RoktoSeva</title>
  <link rel="icon" href="assets/favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col bg-[#070a13] text-white">
  <div id="navbar"></div>

  <main class="flex-1 relative py-16 px-4 sm:px-8">
    <div class="max-w-7xl mx-auto">
      <div class="text-center mb-10">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-3">
          Search <span class="text-red-500">Blood Donors</span>
        </h1>
        <p class="text-slate-400 text-sm max-w-md mx-auto">Find donors by blood group and location across Bangladesh.</p>
      </div>

      <div class="bg-[#0c101f]/70 border border-white/5 rounded-2xl p-5 sm:p-6 mb-10 flex flex-wrap gap-4 justify-center items-end">
        <div>
          <label class="form-label" for="searchBlood">Blood Group</label>
          <select id="searchBlood" class="form-input min-w-[140px]">
            <option value="All">All Groups</option>
            <option value="A+">A+</option><option value="A-">A-</option>
            <option value="B+">B+</option><option value="B-">B-</option>
            <option value="AB+">AB+</option><option value="AB-">AB-</option>
            <option value="O+">O+</option><option value="O-">O-</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="searchDistrict">District</label>
          <select id="searchDistrict" class="form-input min-w-[160px]">
            <option value="All">All Districts</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="searchUpazila">Upazila</label>
          <select id="searchUpazila" class="form-input min-w-[160px]" disabled>
            <option value="All">All Upazilas</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="searchAvailable">Availability</label>
          <select id="searchAvailable" class="form-input min-w-[140px]">
            <option value="All">All</option>
            <option value="yes">Available only</option>
          </select>
        </div>
        <button type="button" id="searchBtn" class="px-6 py-3 bg-gradient-to-r from-red-600 to-rose-600 rounded-xl text-white font-bold text-sm uppercase tracking-wider hover:shadow-[0_0_20px_rgba(239,68,68,0.4)] transition-all disabled:opacity-50 flex items-center gap-2">
          <span id="searchBtnText">Search</span>
          <span id="searchSpinner" class="spinner hidden"></span>
        </button>
      </div>

      <div id="searchResults" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        <p class="col-span-full text-center text-slate-500 py-16">Select filters and click Search to find donors.</p>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <script src="js/locationData.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/common.js"></script>
  <script>
    const distSelect = document.getElementById("searchDistrict");
    const upaSelect = document.getElementById("searchUpazila");

    districts.sort((a, b) => a.name.localeCompare(b.name)).forEach((d) => {
      const o = document.createElement("option");
      o.value = d.name;
      o.textContent = d.name;
      o.dataset.id = d.id;
      distSelect.appendChild(o);
    });

    distSelect.addEventListener("change", () => {
      const name = distSelect.value;
      upaSelect.innerHTML = '<option value="All">All Upazilas</option>';
      if (name === "All") {
        upaSelect.disabled = true;
        return;
      }
      const dist = districts.find((d) => d.name === name);
      if (!dist) {
        upaSelect.disabled = true;
        return;
      }
      upaSelect.disabled = false;
      upazilas
        .filter((u) => u.district_id === dist.id)
        .sort((a, b) => a.name.localeCompare(b.name))
        .forEach((u) => {
          const o = document.createElement("option");
          o.value = u.name;
          o.textContent = u.name;
          upaSelect.appendChild(o);
        });
    });

    async function requestContact(donorId, donorName) {
      const user = getCurrentUser();
      if (!user) {
        showToast("Please login first to request contact.", "error");
        setTimeout(() => (window.location.href = "login.html"), 1000);
        return;
      }
      try {
        const fb = await initFirebase();
        if (!fb) {
          showToast("Firebase not connected.", "error");
          return;
        }
        const { collection, addDoc, serverTimestamp } = await getFirestoreFns();
        await addDoc(collection(fb.db, "contactRequests"), {
          donorId,
          donorName: donorName || "",
          requesterId: user.uid,
          requesterName: user.name || "",
          requesterPhone: user.phone || "",
          requesterEmail: user.email || "",
          status: "Pending",
          createdAt: serverTimestamp()
        });
        showToast("Contact request sent! Admin will connect you with the donor.", "success");
      } catch (err) {
        console.error(err);
        showToast(err.message || "Failed to send request.", "error");
      }
    }

    function renderDonors(list) {
      const grid = document.getElementById("searchResults");
      if (!list.length) {
        grid.innerHTML = emptyStateHTML("No donors found matching your criteria.", null, null);
        return;
      }
      grid.innerHTML = list.map((d) => {
        const initial = (d.name || "D").charAt(0).toUpperCase();
        const photo = d.image || `https://placehold.co/100x100/1e293b/ef4444?text=${initial}`;
        const isFemale = (d.gender || "").toLowerCase() === "female";
        const avail = d.available !== false && isDonorAvailable(d.lastDonationDate);
        const lastDon = formatDonationDate(d.lastDonationDate);

        let phoneRow = "";
        let actionBtn = "";

        if (isFemale) {
          phoneRow = `<p class="text-xs">📞 Phone: <span class="text-slate-400 font-medium">Hidden (Female donor)</span></p>`;
          if (avail) {
            actionBtn = `<button type="button" onclick="requestContact('${d.id || d.uid || ""}', '${(d.name || "").replace(/'/g, "\\'")}')" class="mt-5 block w-full text-center py-2.5 bg-white/5 border border-white/10 text-white rounded-xl hover:bg-red-600 hover:border-red-500 transition-all font-bold uppercase text-xs tracking-wider">Request Contact via Admin</button>`;
          } else {
            actionBtn = `<div class="mt-5 block text-center w-full py-2.5 bg-white/5 border border-white/5 text-slate-500 rounded-xl font-bold uppercase text-xs tracking-wider cursor-not-allowed">Unavailable</div>`;
          }
        } else {
          const phoneDisplay = d.phone
            ? d.phone.replace(/(\d{5})\d{4}(\d{2})/, "$1****$2")
            : "Hidden";
          phoneRow = `<p class="text-xs">📞 Phone: <span class="text-slate-300 font-medium">${phoneDisplay}</span></p>`;
          if (d.phone && avail) {
            actionBtn = `<a href="tel:${d.phone}" class="mt-5 block text-center w-full py-2.5 bg-white/5 border border-white/10 text-white rounded-xl hover:bg-red-600 hover:border-red-500 transition-all font-bold uppercase text-xs tracking-wider">Call Donor</a>`;
          } else {
            actionBtn = `<div class="mt-5 block text-center w-full py-2.5 bg-white/5 border border-white/5 text-slate-500 rounded-xl font-bold uppercase text-xs tracking-wider cursor-not-allowed">Unavailable</div>`;
          }
        }

        return `
        <div class="bg-[#0c101f]/70 border border-white/5 rounded-2xl p-6 hover:border-red-500/30 transition-all">
          <div class="flex items-center gap-4 mb-4">
            <img src="${photo}" alt="${d.name || "Donor"}"
                 class="w-14 h-14 rounded-2xl object-cover border border-red-500/20 bg-slate-800"
                 onerror="this.src='https://placehold.co/100x100/1e293b/ef4444?text=${initial}'" />
            <div>
              <h3 class="font-bold text-white">${d.name || "Donor"}</h3>
              <p class="text-xs text-slate-400">${d.upazila || ""}${d.upazila && d.district ? ", " : ""}${d.district || ""}</p>
              <span class="inline-block mt-1 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border ${avail ? "text-green-400 bg-green-500/10 border-green-500/20" : "text-yellow-400 bg-yellow-500/10 border-yellow-500/20"}">${avail ? "Available" : "Not Available"}</span>
            </div>
          </div>
          <div class="space-y-1.5 text-sm text-slate-400">
            <p class="text-xs">🩸 Group: <span class="text-red-400 font-bold">${d.bloodGroup || "—"}</span></p>
            ${phoneRow}
            <p class="text-xs">📅 Last Donation: <span class="text-slate-300 font-medium">${lastDon}</span></p>
            ${d.donationCount ? `<p class="text-xs">❤️ Donations: <span class="text-slate-300 font-medium">${d.donationCount}</span></p>` : ""}
          </div>
          ${actionBtn}
        </div>
      `;
      }).join("");
    }

    document.getElementById("searchBtn").addEventListener("click", async () => {
      const blood = document.getElementById("searchBlood").value;
      const district = document.getElementById("searchDistrict").value;
      const upazila = document.getElementById("searchUpazila").value;
      const availableOnly = document.getElementById("searchAvailable").value === "yes";
      const btn = document.getElementById("searchBtn");
      const btnText = document.getElementById("searchBtnText");
      const spinner = document.getElementById("searchSpinner");
      const grid = document.getElementById("searchResults");

      btn.disabled = true;
      btnText.textContent = "Searching...";
      spinner.classList.remove("hidden");
      grid.innerHTML = loadingHTML();

      try {
        const fb = await initFirebase();
        if (!fb) {
          grid.innerHTML = emptyStateHTML(
            "Firebase is not configured. Add your keys in js/firebase-config.js to search real donors.",
            "register.html",
            "Register as donor →"
          );
          return;
        }

        const { collection, getDocs } = await getFirestoreFns();
        const snap = await getDocs(collection(fb.db, "users"));
        let results = [];
        snap.forEach((docSnap) => {
          const d = docSnap.data();
          if (d.role && d.role !== "donor" && d.role !== "user") return;
          const matchBlood = blood === "All" || d.bloodGroup === blood;
          const matchDist = district === "All" || d.district === district;
          const matchUpa = upazila === "All" || d.upazila === upazila;
          const avail = d.available !== false && isDonorAvailable(d.lastDonationDate);
          const matchAvail = !availableOnly || avail;
          if (matchBlood && matchDist && matchUpa && matchAvail) {
            results.push({ id: docSnap.id, ...d });
          }
        });

        renderDonors(results);
      } catch (err) {
        console.error(err);
        grid.innerHTML = emptyStateHTML("Search failed. Check Firebase connection.", null, null);
        showToast("Search failed. Try again.", "error");
      } finally {
        btn.disabled = false;
        btnText.textContent = "Search";
        spinner.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
