<!DOCTYPE html>
<html lang="bn" data-page="create-request">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Blood Request | RoktoSeva</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:title" content="Create Blood Request | RoktoSeva" />
  <meta property="og:image" content="https://roktosheba.agi.bd/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#dc2626" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" href="../assets/favicon.ico" />
  <script src="../js/site-config.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="min-h-screen flex flex-col bg-[#070a13] text-white">
  <div id="navbar"></div>

  <main id="main" class="flex-1 relative py-12 px-4 sm:px-8">
    <div class="max-w-2xl mx-auto">
      <h1 class="text-3xl font-extrabold tracking-tight mb-2">
        Create <span class="text-red-500">Blood Request</span>
      </h1>
      <p class="text-slate-400 text-sm mb-8">Fill in the patient details to post an emergency blood request.</p>

      <form id="requestForm" class="reveal card-lift bg-[#0c101f]/70 border border-white/5 rounded-2xl p-6 sm:p-8 space-y-5" novalidate>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div>
            <label class="form-label" for="patientName">Patient Name</label>
            <input type="text" id="patientName" name="patientName" required class="form-input" placeholder="Patient full name" />
          </div>
          <div>
            <label class="form-label" for="bloodGroup">Blood Group Needed</label>
            <select id="bloodGroup" name="bloodGroup" required class="form-input">
              <option value="">Select</option>
              <option value="A+">A+</option><option value="A-">A-</option>
              <option value="B+">B+</option><option value="B-">B-</option>
              <option value="AB+">AB+</option><option value="AB-">AB-</option>
              <option value="O+">O+</option><option value="O-">O-</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="hospital">Hospital / Clinic</label>
            <input type="text" id="hospital" name="hospital" required class="form-input" placeholder="Hospital name" />
          </div>
          <div>
            <label class="form-label" for="dateNeeded">Date Needed</label>
            <input type="date" id="dateNeeded" name="dateNeeded" required class="form-input" />
          </div>
          <div>
            <label class="form-label" for="reqDistrict">District</label>
            <select name="district" id="reqDistrict" required class="form-input">
              <option value="">Select District</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="reqUpazila">Upazila</label>
            <select name="upazila" id="reqUpazila" required disabled class="form-input">
              <option value="">Select District First</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="status">Urgency</label>
            <select id="status" name="status" class="form-input">
              <option value="Pending">Normal</option>
              <option value="Urgent">Urgent</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="unitsNeeded">Units Needed</label>
            <input type="number" id="unitsNeeded" name="unitsNeeded" min="1" max="20" value="1" required class="form-input" placeholder="1" />
          </div>
          <div>
            <label class="form-label" for="patientAge">Patient Age (optional)</label>
            <input type="number" id="patientAge" name="patientAge" min="0" max="120" class="form-input" placeholder="e.g. 35" />
          </div>
          <div>
            <label class="form-label" for="phone">Contact Phone</label>
            <input type="tel" id="phone" name="phone" required class="form-input" placeholder="01XXXXXXXXX" />
          </div>
          <div>
            <label class="form-label" for="emergencyContact">Emergency Contact Name</label>
            <input type="text" id="emergencyContact" name="emergencyContact" class="form-input" placeholder="Relative / guardian name" />
          </div>
        </div>
        <div>
          <label class="form-label" for="notes">Additional Notes (optional)</label>
          <textarea id="notes" name="notes" rows="3" class="form-input resize-none" placeholder="Any special instructions..."></textarea>
        </div>
        <button type="submit" id="submitBtn" class="w-full py-3.5 bg-gradient-to-r from-red-600 to-rose-600 btn-shine rounded-xl text-white font-bold uppercase tracking-widest shadow-[0_4px_25px_rgba(220,38,38,0.25)] hover:shadow-[0_4px_35px_rgba(220,38,38,0.45)] transition-all disabled:opacity-50 flex items-center justify-center gap-2">
          <span id="submitBtnText">Post Request</span>
          <span id="submitSpinner" class="spinner hidden"></span>
        </button>
      </form>
    </div>
  </main>

  <div id="footer"></div>
  <script src="../js/locationData.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/common.js"></script>
  <script>
    const user = requireAuth();

    const distSel = document.getElementById("reqDistrict");
    const upaSel = document.getElementById("reqUpazila");
    districts.sort((a, b) => a.name.localeCompare(b.name)).forEach((d) => {
      const o = document.createElement("option");
      o.value = d.id;
      o.textContent = d.name;
      distSel.appendChild(o);
    });
    distSel.addEventListener("change", () => {
      const id = distSel.value;
      upaSel.innerHTML = "";
      if (!id) {
        upaSel.disabled = true;
        upaSel.innerHTML = '<option value="">Select District First</option>';
        return;
      }
      const filtered = upazilas
        .filter((u) => u.district_id === id)
        .sort((a, b) => a.name.localeCompare(b.name));
      upaSel.disabled = false;
      upaSel.innerHTML = '<option value="">Select Upazila</option>';
      filtered.forEach((u) => {
        const o = document.createElement("option");
        o.value = u.name;
        o.textContent = u.name;
        upaSel.appendChild(o);
      });
    });

    // Min date = today
    const dateInput = document.getElementById("dateNeeded");
    const _n = new Date(); // local date (UTC would allow "yesterday" in Bangladesh)
    const today = _n.getFullYear() + "-" + String(_n.getMonth() + 1).padStart(2, "0") + "-" + String(_n.getDate()).padStart(2, "0");
    dateInput.setAttribute("min", today);

    document.getElementById("requestForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const btnText = document.getElementById("submitBtnText");
      const spinner = document.getElementById("submitSpinner");

      const patientName = document.getElementById("patientName").value.trim();
      const bloodGroup = document.getElementById("bloodGroup").value;
      const hospital = document.getElementById("hospital").value.trim();
      const dateNeeded = document.getElementById("dateNeeded").value;
      const districtId = distSel.value;
      const upazila = upaSel.value;
      const status = document.getElementById("status").value === "Urgent" ? "Urgent" : "Pending";
      const unitsNeeded = Math.min(20, Math.max(1, parseInt(document.getElementById("unitsNeeded").value, 10) || 1));
      const ageRaw = parseInt(document.getElementById("patientAge").value, 10);
      const patientAge = Number.isFinite(ageRaw) ? Math.min(120, Math.max(0, ageRaw)) : null;
      const phone = document.getElementById("phone").value.trim().replace(/\s|-/g, "");
      const emergencyContact = document.getElementById("emergencyContact").value.trim().slice(0, 80);
      const notes = document.getElementById("notes").value.trim().slice(0, 500);
      const districtName = districts.find((d) => d.id === districtId)?.name || "";

      if (!patientName || !bloodGroup || !hospital || !dateNeeded || !districtId || !upazila) return showToast("Please fill all required fields.", "error");
      if (!isValidBDPhone(phone)) return showToast("Enter a valid BD phone (01XXXXXXXXX).", "error");

      const reset = () => { btn.disabled = false; btnText.textContent = _("Post Request"); spinner.classList.add("hidden"); };
      btn.disabled = true; btnText.textContent = _("Posting..."); spinner.classList.remove("hidden");
      try {
        const fb = await initFirebase();
        if (!fb) { showToast("Service is temporarily unavailable.", "error"); return reset(); }
        const { collection, doc, writeBatch, serverTimestamp } = await getFirestoreFns();

        // Public request (no phone) + private contact doc (logged-in users only)
        const reqRef = doc(collection(fb.db, "requests"));
        const batch = writeBatch(fb.db);
        batch.set(reqRef, {
          patientName: patientName.slice(0, 80), bloodGroup, hospital: hospital.slice(0, 120), dateNeeded,
          district: districtName, upazila, status, unitsNeeded, patientAge, notes,
          userId: user.uid, userName: (user.name || "").slice(0, 80), createdAt: serverTimestamp()
        });
        batch.set(doc(fb.db, "requestContacts", reqRef.id), {
          userId: user.uid, phone, emergencyContact: emergencyContact || null
        });
        await batch.commit();

        showToast("Blood request posted successfully!", "success");
        setTimeout(() => (window.location.href = "my-requests.html"), 900);
      } catch (err) {
        console.error(err);
        showToast("Failed to post request.", "error");
        reset();
      }
    });
  </script>
</body>
</html>
