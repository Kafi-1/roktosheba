<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - RoktoSeva</title>
  <link rel="icon" href="assets/favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col bg-[#070a13] text-white">
  <div id="navbar"></div>

  <main class="flex-1 relative py-20 px-4 sm:px-8">
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-red-600/5 rounded-full blur-[140px] -z-10"></div>

    <div class="max-w-4xl mx-auto">
      <div class="text-center mb-12">
        <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-3">
          Get In <span class="text-red-500">Touch</span>
        </h1>
        <p class="text-slate-400 text-sm max-w-md mx-auto">Have a question, suggestion, or need help? Send us a message — we respond within 24 hours.</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-5 gap-8">
        <!-- Info -->
        <div class="md:col-span-2 space-y-6">
          <div class="bg-[#0c101f]/70 border border-white/5 rounded-2xl p-6">
            <h3 class="text-xs font-bold uppercase tracking-widest text-red-400 mb-4">Contact Info</h3>
            <div class="space-y-4 text-sm">
              <div>
                <p class="text-slate-500 text-xs uppercase tracking-wider mb-1">Email</p>
                <a href="mailto:roktoseva@gmail.com" class="text-white hover:text-red-400 transition-colors">roktoseva@gmail.com</a>
              </div>
              <div>
                <p class="text-slate-500 text-xs uppercase tracking-wider mb-1">Location</p>
                <p class="text-white">Dhaka, Bangladesh</p>
              </div>
              <div>
                <p class="text-slate-500 text-xs uppercase tracking-wider mb-1">Availability</p>
                <span class="inline-flex items-center gap-1.5 text-xs text-red-500 font-bold uppercase tracking-widest bg-red-500/10 border border-red-500/20 px-2.5 py-1 rounded-lg">
                  <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
                  Live 24/7
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- Form -->
        <div class="md:col-span-3">
          <form id="contactForm" class="bg-[#0c101f]/70 border border-white/5 rounded-2xl p-6 sm:p-8 space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
              <div>
                <label class="form-label">Your Name</label>
                <input type="text" name="name" required class="form-input" placeholder="Full name" />
              </div>
              <div>
                <label class="form-label">Email</label>
                <input type="email" name="email" required class="form-input" placeholder="name@example.com" />
              </div>
            </div>
            <div>
              <label class="form-label">Subject</label>
              <input type="text" name="subject" required class="form-input" placeholder="How can we help?" />
            </div>
            <div>
              <label class="form-label">Message</label>
              <textarea name="message" required rows="5" class="form-input resize-none" placeholder="Write your message here..."></textarea>
            </div>
            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-red-600 to-rose-600 rounded-xl text-white font-bold uppercase tracking-widest shadow-[0_4px_25px_rgba(220,38,38,0.25)] hover:shadow-[0_4px_35px_rgba(220,38,38,0.45)] transition-all">
              Send Message
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <script src="js/common.js"></script>
  <script>
    document.getElementById('contactForm').addEventListener('submit', (e) => {
      e.preventDefault();
      showToast('Message sent successfully! We will reply soon.', 'success');
      e.target.reset();
    });
  </script>
</body>
</html>
