<!DOCTYPE html>
<html lang="bn" data-page="register">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Become a Donor | RoktoSeva</title>
  <meta name="description" content="Register as a blood donor and help save lives in Bangladesh." />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Become a Donor | RoktoSeva" />
  <meta property="og:image" content="https://roktosheba.agi.bd/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#dc2626" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" href="assets/favicon.ico" />
  <script src="js/site-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col bg-[#070a13] text-white">

  <div id="navbar"></div>

  <main id="main" class="flex-1 relative min-h-screen flex items-center justify-center px-4 py-12 overflow-hidden">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-red-600/5 rounded-full blur-[140px] -z-10"></div>

    <div class="w-full max-w-2xl animate-pop backdrop-blur-xl bg-[#0c101f]/80 border border-white/5 rounded-3xl p-8 shadow-[0_20px_50px_rgba(0,0,0,0.6)] relative z-10">
      <div class="flex justify-center mb-6">
        <div class="p-3 rounded-2xl bg-white/[0.03] border border-white/5 shadow-inner">
          <div class="flex items-center gap-2.5">
            <img src="assets/roktoseba.jpg" alt="Logo" class="object-cover shrink-0 rounded-full border-2 border-red-500/50" style="width:50px;height:50px" onerror="this.src='https://placehold.co/100x100/ef4444/ffffff?text=RS'">
            <div class="flex flex-col">
              <span class="font-black uppercase tracking-wider leading-none text-lg">
                <span class="text-red-500">রক্ত</span><span class="text-red-500">সেবা</span>
              </span>
              <span class="text-[10px] font-semibold uppercase tracking-widest text-slate-400 mt-1">Blood Donation</span>
            </div>
          </div>
        </div>
      </div>

      <h2 class="text-3xl font-black text-center text-white uppercase tracking-wider mb-2">
        Join the <span class="text-red-500">Network</span>
      </h2>
      <p class="text-center text-slate-400 text-sm mb-8 font-medium uppercase tracking-widest">
        Register as a blood donor
      </p>

      <div id="googleBox"></div>

      <form id="registerForm" class="grid grid-cols-1 sm:grid-cols-2 gap-5" novalidate>
        <!-- Profile Photo -->
        <div class="sm:col-span-2 flex flex-col items-center gap-3 mb-2">
          <div class="relative">
            <img id="photoPreview" src="https://placehold.co/120x120/1e293b/ef4444?text=Photo" alt="Preview"
                 class="w-24 h-24 rounded-full border-2 border-red-500/40 object-cover bg-slate-800" />
            <label for="profilePhoto" class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-red-600 flex items-center justify-center cursor-pointer hover:bg-red-500 transition-colors border-2 border-[#0c101f]" title="Upload photo">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </label>
            <input type="file" id="profilePhoto" accept="image/*" class="hidden" />
          </div>
          <p class="text-[10px] text-slate-500 uppercase tracking-wider">Profile Photo (optional, max 5MB)</p>
        </div>

        <div>
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" name="name" required minlength="2" placeholder="Your full name" class="form-input" />
        </div>
        <div>
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com" class="form-input" autocomplete="email" />
        </div>
        <div>
          <label class="form-label" for="phone">Phone (BD)</label>
          <input type="tel" id="phone" name="phone" required placeholder="01XXXXXXXXX" class="form-input" pattern="01[3-9][0-9]{8}" />
        </div>
        <div>
          <label class="form-label" for="gender">Gender</label>
          <select id="gender" name="gender" required class="form-input">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="age">Age</label>
          <input type="number" id="age" name="age" min="18" max="60" required placeholder="18–60" class="form-input" inputmode="numeric" />
        </div>
        <div id="guardianWrap" class="hidden">
          <label class="form-label" for="guardianPhone">Guardian Phone (optional)</label>
          <input type="tel" id="guardianPhone" name="guardianPhone" placeholder="01XXXXXXXXX" class="form-input" pattern="01[3-9][0-9]{8}" />
          <p class="text-[10px] text-slate-500 mt-1">Female donors: personal number stays hidden.</p>
        </div>
        <div>
          <label class="form-label" for="blood_group">Blood Group</label>
          <select id="blood_group" name="blood_group" required class="form-input">
            <option value="">Select Blood Group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="districtSelect">District</label>
          <select name="district" id="districtSelect" required class="form-input">
            <option value="">Select District</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="upazilaSelect">Upazila</label>
          <select name="upazila" id="upazilaSelect" required disabled class="form-input">
            <option value="">Select District First</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="hasDonated">Donated Blood Before?</label>
          <select id="hasDonated" name="hasDonated" class="form-input">
            <option value="no">No, first time</option>
            <option value="yes">Yes</option>
          </select>
        </div>
        <div id="lastDonationWrap" class="hidden">
          <label class="form-label" for="lastDonationDate">Last Donation Date</label>
          <input type="date" id="lastDonationDate" name="lastDonationDate" class="form-input" />
        </div>
        <div>
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6" placeholder="Min 6 characters" class="form-input" autocomplete="new-password" />
        </div>
        <div>
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" required minlength="6" placeholder="••••••••" class="form-input" autocomplete="new-password" />
        </div>

        <label class="sm:col-span-2 flex items-start gap-3 text-xs text-slate-400 leading-relaxed cursor-pointer">
          <input type="checkbox" id="consent" class="mt-0.5 w-4 h-4 accent-red-600 shrink-0" />
          <span>I agree that my name, age, blood group and location will be visible to others on this platform.</span>
        </label>

        <div class="sm:col-span-2 pt-2">
          <button type="submit" id="regBtn" class="w-full py-3.5 bg-gradient-to-r from-red-600 to-rose-600 btn-shine border-0 rounded-xl text-white font-bold uppercase tracking-widest shadow-[0_4px_25px_rgba(220,38,38,0.25)] hover:shadow-[0_4px_35px_rgba(220,38,38,0.45)] transition-all duration-300 disabled:opacity-50 flex items-center justify-center gap-2">
            <span id="regBtnText">Register</span>
            <span id="regSpinner" class="spinner hidden"></span>
          </button>
        </div>
      </form>

      <div class="text-center text-sm text-slate-400 mt-6 font-medium">
        Already have an account?
        <a href="login.html" class="text-red-500 hover:text-red-400 transition-colors duration-200 font-bold underline">Login Here</a>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/locationData.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/common.js"></script>
  <script>
    // ?complete=1 → signed-in (e.g. Google) user adds donor details instead of creating a new account
    const completeMode = new URLSearchParams(location.search).has("complete");
    if (completeMode) {
      if (!getCurrentUser()) window.location.replace("login.html");
    } else if (getCurrentUser()) {
      window.location.href = getNext() || "dashboard/index.html";
    }
    document.querySelectorAll('a[href="login.html"]').forEach((a) => (a.href = "login.html" + location.search));

    const districtSelect = document.getElementById("districtSelect");
    const upazilaSelect = document.getElementById("upazilaSelect");
    let selectedPhotoFile = null;

    // Photo preview
    document.getElementById("profilePhoto").addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        showToast("Please select an image file.", "error");
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        showToast("Image must be under 5MB.", "error");
        return;
      }
      selectedPhotoFile = file;
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.getElementById("photoPreview").src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Show/hide last donation date
    document.getElementById("hasDonated").addEventListener("change", (e) => {
      const wrap = document.getElementById("lastDonationWrap");
      if (e.target.value === "yes") {
        wrap.classList.remove("hidden");
      } else {
        wrap.classList.add("hidden");
        document.getElementById("lastDonationDate").value = "";
      }
    });

    // Show guardian phone for female
    document.getElementById("gender").addEventListener("change", (e) => {
      const wrap = document.getElementById("guardianWrap");
      if (e.target.value === "Female") {
        wrap.classList.remove("hidden");
      } else {
        wrap.classList.add("hidden");
        document.getElementById("guardianPhone").value = "";
      }
    });

    districts.sort((a, b) => a.name.localeCompare(b.name)).forEach((d) => {
      const opt = document.createElement("option");
      opt.value = d.id;
      opt.textContent = d.name;
      districtSelect.appendChild(opt);
    });

    districtSelect.addEventListener("change", () => {
      const districtId = districtSelect.value;
      upazilaSelect.innerHTML = "";
      if (!districtId) {
        upazilaSelect.disabled = true;
        upazilaSelect.innerHTML = '<option value="">Select District First</option>';
        return;
      }
      const filtered = upazilas
        .filter((u) => u.district_id === districtId)
        .sort((a, b) => a.name.localeCompare(b.name));
      upazilaSelect.disabled = false;
      upazilaSelect.innerHTML = '<option value="">Select Upazila</option>';
      filtered.forEach((u) => {
        const opt = document.createElement("option");
        opt.value = u.name;
        opt.textContent = u.name;
        upazilaSelect.appendChild(opt);
      });
    });

    if (completeMode) {
      const cu = getCurrentUser() || {};
      document.getElementById("googleBox").remove();
      document.querySelector("h2").dataset.h = "complete"; window.i18n.apply();
      document.getElementById("regBtnText").textContent = "Save Changes";
      document.querySelector("h2 + p").textContent = "Add your donor details";
      ["password", "confirm_password"].forEach((id) => {
        const f = document.getElementById(id); f.required = false; f.closest("div").classList.add("hidden");
      });
      document.getElementById("name").value = cu.name || "";
      const em = document.getElementById("email"); em.value = cu.email || ""; em.readOnly = true; em.classList.add("opacity-60");
      if (cu.phone) document.getElementById("phone").value = cu.phone;
      if (cu.age) document.getElementById("age").value = cu.age;
    }

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("regBtn");
      const btnText = document.getElementById("regBtnText");
      const spinner = document.getElementById("regSpinner");

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim().replace(/\s|-/g, "");
      const gender = document.getElementById("gender").value;
      const age = parseInt(document.getElementById("age").value, 10);
      const bloodGroup = document.getElementById("blood_group").value;
      const districtId = districtSelect.value;
      const upazila = upazilaSelect.value;
      const hasDonated = document.getElementById("hasDonated").value === "yes";
      const lastDonationDate = document.getElementById("lastDonationDate").value || null;
      const guardianPhoneRaw = document.getElementById("guardianPhone")?.value?.trim().replace(/\s|-/g, "") || "";
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm_password").value;
      const districtName = districts.find((d) => d.id === districtId)?.name || "";

      if (name.length < 2 || name.length > 80) return showToast("Please enter your full name (2–80 characters).", "error");
      if (!isValidEmail(email)) return showToast("Please enter a valid email.", "error");
      if (!isValidBDPhone(phone)) return showToast("Enter a valid BD phone (01XXXXXXXXX).", "error");
      if (!gender) return showToast("Select your gender.", "error");
      if (!Number.isInteger(age) || age < 18 || age > 60) return showToast("Age must be between 18 and 60.", "error");
      if (!bloodGroup) return showToast("Select your blood group.", "error");
      if (!districtId || !upazila) return showToast("Select district and upazila.", "error");
      if (hasDonated && !lastDonationDate) return showToast("Please enter your last donation date.", "error");
      if (guardianPhoneRaw && !isValidBDPhone(guardianPhoneRaw)) return showToast("Enter a valid guardian phone (01XXXXXXXXX).", "error");
      if (!completeMode && password.length < 6) return showToast("Password must be at least 6 characters.", "error");
      if (!completeMode && password !== confirm) return showToast("Passwords do not match!", "error");
      if (!document.getElementById("consent").checked) return showToast("Please accept the consent to continue.", "error");

      const reset = () => { btn.disabled = false; btnText.textContent = _(completeMode ? "Save Changes" : "Register"); spinner.classList.add("hidden"); };
      btn.disabled = true;
      btnText.textContent = _("Creating Account...");
      spinner.classList.remove("hidden");

      let authUser = null;
      try {
        const fb = await initFirebase();
        if (!fb) { showToast("Service is temporarily unavailable.", "error"); return reset(); }

        let imageUrl = "";
        if (selectedPhotoFile) {
          btnText.textContent = _("Uploading photo...");
          try { imageUrl = await uploadToImgBB(selectedPhotoFile); }
          catch (upErr) { showToast("Photo upload failed. Continuing without photo.", "error"); }
          btnText.textContent = _("Creating Account...");
        }

        if (completeMode) {
          const cu = getCurrentUser();
          const { doc, setDoc } = await getFirestoreFns();
          const update = {
            uid: cu.uid, role: cu.role || "donor", name, phone, gender, age, bloodGroup,
            district: districtName, upazila, hasDonated, lastDonationDate,
            donationCount: hasDonated ? Math.max(1, cu.donationCount || 0) : cu.donationCount || 0,
            available: isDonorAvailable(lastDonationDate),
            guardianPhone: guardianPhoneRaw || null,
            hidePhone: gender === "Female",
            image: imageUrl || cu.image || ""
          };
          await setDoc(doc(fb.db, "users", cu.uid), update, { merge: true });
          const merged = { ...cu, ...update };
          setCurrentUser(merged);
          await syncPublicProfile(merged);
          showToast("Profile saved! Redirecting...", "success");
          goAfterLogin(700);
          return;
        }

        const { createUserWithEmailAndPassword } = await getAuthFns();
        const { doc, setDoc, serverTimestamp } = await getFirestoreFns();
        const cred = await createUserWithEmailAndPassword(fb.auth, email, password);
        authUser = cred.user;
        const uid = cred.user.uid;

        const profile = {
          uid, name, email, phone, gender, age, bloodGroup,
          district: districtName, upazila, role: "donor", image: imageUrl,
          hasDonated, lastDonationDate, donationCount: hasDonated ? 1 : 0,
          available: isDonorAvailable(lastDonationDate),
          guardianPhone: guardianPhoneRaw || null,
          hidePhone: gender === "Female",
          createdAt: serverTimestamp()
        };
        await setDoc(doc(fb.db, "users", uid), profile);
        await syncPublicProfile(profile);

        const { createdAt, ...cache } = profile;
        setCurrentUser(cache);
        showToast("Account created! Redirecting...", "success");
        goAfterLogin(700);
      } catch (err) {
        console.error(err);
        // Do not leave an orphan auth account if the profile could not be saved
        if (authUser) { try { await authUser.delete(); } catch {} }
        const c = err && err.code;
        showToast(
          c === "auth/email-already-in-use" ? "This email is already registered. Please login."
          : c === "auth/weak-password" ? "Password is too weak."
          : "Registration failed. Please try again.", "error");
        reset();
      }
    });
  </script>
</body>
</html>
