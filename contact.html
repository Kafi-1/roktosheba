<!DOCTYPE html>
<html lang="bn" data-page="contact">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | RoktoSeva</title>
  <meta name="description" content="Questions or suggestions? Send RoktoSeva a message." />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Contact Us | RoktoSeva" />
  <meta property="og:image" content="https://roktosheba.agi.bd/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#dc2626" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" href="assets/favicon.ico" />
  <script src="js/site-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col bg-[#070a13] text-white">
  <div id="navbar"></div>

  <main id="main" class="flex-1 relative py-20 px-4 sm:px-8">
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-red-600/5 rounded-full blur-[140px] -z-10"></div>

    <div class="max-w-4xl mx-auto">
      <div class="text-center mb-12">
        <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-3">
          Get In <span class="text-red-500">Touch</span>
        </h1>
        <p class="text-slate-400 text-sm max-w-md mx-auto">Have a question, suggestion, or need help? Send us a message — we respond within 24 hours.</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-5 gap-8">
        <!-- Info -->
        <div class="md:col-span-2 space-y-6">
          <div class="reveal card-lift bg-[#0c101f]/70 border border-white/5 rounded-2xl p-6">
            <h3 class="text-xs font-bold uppercase tracking-widest text-red-400 mb-4">Contact Info</h3>
            <div class="space-y-4 text-sm">
              <div>
                <p class="text-slate-500 text-xs uppercase tracking-wider mb-1">Email</p>
                <a id="contactEmail" href="mailto:support@roktosheba.agi.bd" class="text-white hover:text-red-400 transition-colors" translate="no">support@roktosheba.agi.bd</a>
              </div>
              <div>
                <p class="text-slate-500 text-xs uppercase tracking-wider mb-1">Location</p>
                <p id="contactAddress" class="text-white" translate="no">Chilmari, Kurigram &amp; All Bangladesh</p>
              </div>
              <div>
                <p class="text-slate-500 text-xs uppercase tracking-wider mb-1">Availability</p>
                <span class="inline-flex items-center gap-1.5 text-xs text-red-500 font-bold uppercase tracking-widest bg-red-500/10 border border-red-500/20 px-2.5 py-1 rounded-lg">
                  <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
                  Live 24/7
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- Form -->
        <div class="md:col-span-3">
          <form id="contactForm" novalidate class="reveal card-lift bg-[#0c101f]/70 border border-white/5 rounded-2xl p-6 sm:p-8 space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
              <div>
                <label class="form-label">Your Name</label>
                <input type="text" name="name" required class="form-input" placeholder="Full name" />
              </div>
              <div>
                <label class="form-label">Email</label>
                <input type="email" name="email" required class="form-input" placeholder="name@example.com" />
              </div>
            </div>
            <div>
              <label class="form-label">Subject</label>
              <input type="text" name="subject" required class="form-input" placeholder="How can we help?" />
            </div>
            <div>
              <label class="form-label">Message</label>
              <textarea name="message" required rows="5" class="form-input resize-none" placeholder="Write your message here..."></textarea>
            </div>
            <input type="text" name="website" id="hp" tabindex="-1" autocomplete="off" class="hidden" aria-hidden="true" />
            <button type="submit" id="contactBtn" class="w-full py-3.5 bg-gradient-to-r from-red-600 to-rose-600 btn-shine rounded-xl text-white font-bold uppercase tracking-widest shadow-[0_4px_25px_rgba(220,38,38,0.25)] hover:shadow-[0_4px_35px_rgba(220,38,38,0.45)] transition-all">
              <span id="contactBtnText">Send Message</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <script src="js/firebase-config.js"></script>
  <script src="js/common.js"></script>
  <script>
    function fillContactInfo() {
      const c = CFG.contact || {};
      const em = document.getElementById("contactEmail");
      if (em && c.email) { em.textContent = c.email; em.href = "mailto:" + c.email; }
      const ad = document.getElementById("contactAddress");
      if (ad && c.address) ad.textContent = L(c.address);
    }
    fillContactInfo();
    window.addEventListener("langchange", fillContactInfo);
    // Prefill from ?subject=...&message=... (e.g. from a donor profile "Admin Support")
    (function () {
      const q = new URLSearchParams(location.search);
      const f = document.getElementById("contactForm");
      if (q.get("subject")) f.subject.value = q.get("subject").slice(0, 150);
      if (q.get("message")) f.message.value = q.get("message").slice(0, 2000);
      const cu = getCurrentUser();
      if (cu) { f.name.value = cu.name || ""; f.email.value = cu.email || ""; }
    })();
    const _oldRefresh = window.refreshChrome; // settings arrive async from Firestore
    window.refreshChrome = function () { _oldRefresh(); fillContactInfo(); };

    document.getElementById("contactForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = document.getElementById("contactBtn");
      const txt = document.getElementById("contactBtnText");
      if (document.getElementById("hp").value) return; // bot
      const name = form.name.value.trim(), email = form.email.value.trim();
      const subject = form.subject.value.trim(), message = form.message.value.trim();
      if (name.length < 2 || !subject || message.length < 5) return showToast("Please fill all required fields.", "error");
      if (!isValidEmail(email)) return showToast("Please enter a valid email.", "error");
      const last = Number(localStorage.getItem("rs_last_msg") || 0);
      if (Date.now() - last < 60000) return showToast("Please wait a minute before sending another message.", "error");

      btn.disabled = true; txt.textContent = _("Sending...");
      try {
        const fb = await initFirebase();
        if (!fb) throw new Error("offline");
        const { collection, addDoc, serverTimestamp } = await getFirestoreFns();
        await addDoc(collection(fb.db, "messages"), {
          name: name.slice(0, 80), email: email.slice(0, 120), subject: subject.slice(0, 150),
          message: message.slice(0, 2000), read: false, userId: (getCurrentUser() || {}).uid || null, createdAt: serverTimestamp()
        });
        localStorage.setItem("rs_last_msg", String(Date.now()));
        showToast("Message sent successfully! We will reply soon.", "success");
        form.reset();
      } catch (err) {
        console.error(err);
        showToast("Could not send message. Please try again.", "error");
      } finally {
        btn.disabled = false; txt.textContent = _("Send Message");
      }
    });
  </script>
</body>
</html>
