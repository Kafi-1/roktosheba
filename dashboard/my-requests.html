<!DOCTYPE html>
<html lang="bn" data-page="my-requests">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Requests | RoktoSeva</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:title" content="My Requests | RoktoSeva" />
  <meta property="og:image" content="https://roktosheba.agi.bd/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#dc2626" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" href="../assets/favicon.ico" />
  <script src="../js/site-config.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="min-h-screen flex flex-col bg-[#070a13] text-white">
  <div id="navbar"></div>

  <main id="main" class="flex-1 relative py-12 px-4 sm:px-8">
    <div class="max-w-5xl mx-auto">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
        <div>
          <h1 class="text-3xl font-extrabold tracking-tight">My <span class="text-red-500">Requests</span></h1>
          <p class="text-slate-400 text-sm mt-1">Track your blood donation requests.</p>
        </div>
        <a href="create-request.html" class="px-5 py-2.5 bg-gradient-to-r from-red-600 to-rose-600 btn-shine rounded-xl text-white font-bold text-sm uppercase tracking-wider hover:shadow-[0_0_20px_rgba(239,68,68,0.4)] transition-all text-center">
          + New Request
        </a>
      </div>

      <div id="requestsList" class="space-y-4">
        <!-- loaded by JS -->
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/common.js"></script>
  <script>
    const user = requireAuth();
    const listEl = document.getElementById("requestsList");
    let items = [];

    function statusBadge(st) {
      const s = (st || "Pending");
      const cls = s === "Urgent" ? "text-red-400 bg-red-500/10 border-red-500/20"
        : s === "Fulfilled" ? "text-green-400 bg-green-500/10 border-green-500/20"
        : s === "Cancelled" ? "text-slate-400 bg-slate-500/10 border-slate-500/20"
        : "text-yellow-500 bg-yellow-500/10 border-yellow-500/20";
      return `<span class="text-[10px] uppercase font-bold ${cls} px-3 py-1.5 rounded-lg border">${escapeHTML(s)}</span>`;
    }

    function render() {
      if (!items.length) {
        listEl.innerHTML = emptyStateHTML("You have no active requests yet.", "create-request.html", "Create your first request →");
        revealAll(listEl);
        return;
      }
      listEl.innerHTML = items.map((r, i) => {
        const open = r.status === "Pending" || r.status === "Urgent";
        const loc = [r.upazila, r.district].filter(Boolean).join(", ");
        return `
        <div class="glass-card card-lift rounded-2xl p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 reveal" style="--d:${(i % 6) * 60}ms">
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-2xl bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-500 font-black text-lg shrink-0" translate="no">${escapeHTML(r.bloodGroup || "—")}</div>
            <div>
              <h3 class="font-bold text-white">${u(r.patientName || "Patient")}</h3>
              <p class="text-xs text-slate-400 mt-1">🏥 ${u(r.hospital || "—")} · 📍 ${u(loc || "—")}</p>
              <p class="text-xs text-slate-500 mt-1">📅 <span>Needed</span>: ${u(window.i18n.fmtDate(r.dateNeeded) || r.dateNeeded || "—")}</p>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-2 sm:justify-end">
            ${statusBadge(r.status)}
            ${open ? `<button onclick="markFulfilled('${escapeHTML(r.id)}')" class="px-3 py-1.5 text-[11px] font-bold uppercase rounded-lg bg-green-600/10 text-green-400 border border-green-500/30 hover:bg-green-600 hover:text-white transition-all">Mark Fulfilled</button>` : ""}
            <button onclick="removeRequest('${escapeHTML(r.id)}')" class="px-3 py-1.5 text-[11px] font-bold uppercase rounded-lg bg-red-600/10 text-red-400 border border-red-500/30 hover:bg-red-600 hover:text-white transition-all">Delete</button>
          </div>
        </div>`;
      }).join("");
      revealAll(listEl);
    }

    async function markFulfilled(id) {
      try {
        const fb = await initFirebase();
        const { doc, updateDoc } = await getFirestoreFns();
        await updateDoc(doc(fb.db, "requests", id), { status: "Fulfilled" });
        const r = items.find((x) => x.id === id); if (r) r.status = "Fulfilled";
        render(); showToast("Request updated.", "success");
      } catch (e) { console.error(e); showToast("Action failed. Try again.", "error"); }
    }
    async function removeRequest(id) {
      if (!confirm(_("Delete this request?"))) return;
      try {
        const fb = await initFirebase();
        const { doc, deleteDoc } = await getFirestoreFns();
        await deleteDoc(doc(fb.db, "requests", id));
        try { await deleteDoc(doc(fb.db, "requestContacts", id)); } catch {} // may not exist for old requests
        items = items.filter((x) => x.id !== id);
        render(); showToast("Request deleted.", "success");
      } catch (e) { console.error(e); showToast("Action failed. Try again.", "error"); }
    }

    async function loadMyRequests() {
      listEl.innerHTML = loadingHTML(2);
      const fb = await initFirebase();
      if (!fb) { listEl.innerHTML = emptyStateHTML("Could not load your requests.", "create-request.html", "Create a request →"); return; }
      try {
        const { collection, getDocs, query, where } = await getFirestoreFns();
        const snap = await getDocs(query(collection(fb.db, "requests"), where("userId", "==", user.uid)));
        items = [];
        snap.forEach((s) => items.push({ id: s.id, ...s.data() }));
        items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        render();
      } catch (err) {
        console.error(err);
        listEl.innerHTML = emptyStateHTML("Could not load your requests.", "create-request.html", "Create a request →");
      }
    }
    window.addEventListener("langchange", render);
    loadMyRequests();
  </script>
</body>
</html>
