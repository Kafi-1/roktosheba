<!DOCTYPE html>
<html lang="bn" data-page="search">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Blood Donors | RoktoSeva</title>
  <meta name="description" content="Search blood donors by blood group, district and upazila across Bangladesh." />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Search Blood Donors | RoktoSeva" />
  <meta property="og:image" content="https://roktosheba.agi.bd/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#dc2626" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" href="assets/favicon.ico" />
  <script src="js/site-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col bg-[#070a13] text-white">
  <div id="navbar"></div>

  <main id="main" class="flex-1 relative py-16 px-4 sm:px-8">
    <div class="max-w-7xl mx-auto">
      <div class="text-center mb-10">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-3">
          Search <span class="text-red-500">Blood Donors</span>
        </h1>
        <p class="text-slate-400 text-sm max-w-md mx-auto">Find donors by blood group and location across Bangladesh.</p>
      </div>

      <div class="reveal card-lift bg-[#0c101f]/70 border border-white/5 rounded-2xl p-5 sm:p-6 mb-10 flex flex-wrap gap-4 justify-center items-end">
        <div>
          <label class="form-label" for="searchBlood">Blood Group</label>
          <select id="searchBlood" class="form-input min-w-[140px]">
            <option value="All">All Groups</option>
            <option value="A+">A+</option><option value="A-">A-</option>
            <option value="B+">B+</option><option value="B-">B-</option>
            <option value="AB+">AB+</option><option value="AB-">AB-</option>
            <option value="O+">O+</option><option value="O-">O-</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="searchDistrict">District</label>
          <select id="searchDistrict" class="form-input min-w-[160px]">
            <option value="All">All Districts</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="searchUpazila">Upazila</label>
          <select id="searchUpazila" class="form-input min-w-[160px]" disabled>
            <option value="All">All Upazilas</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="searchAvailable">Availability</label>
          <select id="searchAvailable" class="form-input min-w-[140px]">
            <option value="All">All</option>
            <option value="yes">Available only</option>
          </select>
        </div>
        <label class="flex items-center gap-2 text-xs text-slate-400 pb-3 cursor-pointer select-none">
          <input type="checkbox" id="searchCompat" class="w-4 h-4 accent-red-600" />
          <span>Include compatible groups</span>
        </label>
        <button type="button" id="searchBtn" class="px-6 py-3 bg-gradient-to-r from-red-600 to-rose-600 btn-shine rounded-xl text-white font-bold text-sm uppercase tracking-wider hover:shadow-[0_0_20px_rgba(239,68,68,0.4)] transition-all disabled:opacity-50 flex items-center gap-2">
          <span id="searchBtnText">Search</span>
          <span id="searchSpinner" class="spinner hidden"></span>
        </button>
      </div>

      <div id="searchResults" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        <p class="col-span-full text-center text-slate-500 py-16">Select filters and click Search to find donors.</p>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <script src="js/locationData.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/common.js"></script>
  <script>
    const distSelect = document.getElementById("searchDistrict");
    const upaSelect = document.getElementById("searchUpazila");
    const loggedIn = !!getCurrentUser();
    let lastResults = [];

    [...districts].sort((a, b) => a.name.localeCompare(b.name)).forEach((d) => {
      const o = document.createElement("option");
      o.value = d.name; o.textContent = d.name; o.setAttribute("translate", "no");
      distSelect.appendChild(o);
    });

    function fillUpazilas(districtName, selected) {
      upaSelect.innerHTML = '<option value="All">' + _("All Upazilas") + "</option>";
      const dist = districts.find((d) => d.name === districtName);
      if (!dist) { upaSelect.disabled = true; return; }
      upaSelect.disabled = false;
      upazilas.filter((u) => u.district_id === dist.id).sort((a, b) => a.name.localeCompare(b.name)).forEach((u) => {
        const o = document.createElement("option");
        o.value = u.name; o.textContent = u.name; o.setAttribute("translate", "no");
        upaSelect.appendChild(o);
      });
      if (selected) upaSelect.value = selected;
    }
    distSelect.addEventListener("change", () => fillUpazilas(distSelect.value));

    // ---- contact reveal (login required) ----
    async function revealPhone(id, btn) {
      btn.disabled = true;
      try {
        const fb = await initFirebase();
        const { doc, getDoc } = await getFirestoreFns();
        const snap = await getDoc(doc(fb.db, "donorContacts", id));
        const phone = snap.exists() ? String(snap.data().phone || "").replace(/[^\d+]/g, "") : "";
        if (!phone) throw new Error("none");
        btn.outerHTML = `<a href="tel:${escapeHTML(phone)}" class="mt-5 block text-center w-full py-2.5 bg-green-600 text-white rounded-xl font-bold text-xs tracking-wider">📞 <span translate="no">${escapeHTML(phone)}</span></a>`;
      } catch {
        btn.disabled = false;
        showToast("Could not load contact. Try again.", "error");
      }
    }
    async function requestContact(id, btn) {
      btn.disabled = true;
      const ok = await createContactRequest(id, btn.dataset.name || "");
      if (!ok) btn.disabled = false;
    }

    function donorCard(d, i) {
      const initial = (d.name || "D").charAt(0).toUpperCase();
      const hidePhone = d.hidePhone === true || (d.gender || "").toLowerCase() === "female";
      const avail = d.available !== false && isDonorAvailable(d.lastDonationDate);
      const id = d.id || d.uid;
      let action = `<div class="mt-5 block text-center w-full py-2.5 bg-white/5 border border-white/5 text-slate-500 rounded-xl font-bold uppercase text-xs tracking-wider cursor-not-allowed">Unavailable</div>`;
      if (avail) {
        if (!loggedIn) action = `<a href="${loginUrl()}" class="mt-5 block text-center w-full py-2.5 bg-white/5 border border-white/10 text-white rounded-xl hover:bg-red-600 hover:border-red-500 transition-all font-bold uppercase text-xs tracking-wider">Login to see contact</a>`;
        else if (hidePhone) action = `<button type="button" data-name="${escapeHTML(d.name || "")}" onclick="requestContact('${escapeHTML(id)}', this)" class="mt-5 block w-full text-center py-2.5 bg-white/5 border border-white/10 text-white rounded-xl hover:bg-red-600 hover:border-red-500 transition-all font-bold uppercase text-xs tracking-wider disabled:opacity-50">Request Contact via Admin</button>`;
        else action = `<button type="button" onclick="revealPhone('${escapeHTML(id)}', this)" class="btn-shine mt-5 block w-full text-center py-2.5 bg-gradient-to-r from-red-600 to-rose-600 text-white rounded-xl font-bold uppercase text-xs tracking-wider disabled:opacity-50">Show Phone</button>`;
      }
      const loc = [d.upazila, d.district].filter(Boolean).join(", ");
      return `
      <div class="glass-card card-lift rounded-2xl p-6 reveal" style="--d:${(i % 9) * 50}ms">
        <a href="donor.html?id=${encodeURIComponent(id)}" class="flex items-center gap-4 mb-4 group">
          <img src="${escapeHTML(safeImg(d.image, initial))}" alt="" loading="lazy" class="w-14 h-14 rounded-2xl object-cover border border-red-500/20 bg-slate-800"
               onerror="this.onerror=null;this.src='https://placehold.co/100x100/1e293b/ef4444?text=${encodeURIComponent(initial)}'" />
          <div class="min-w-0">
            <h3 class="font-bold text-white truncate group-hover:text-red-400 transition-colors">${u(d.name || "Donor")}</h3>
            <p class="text-xs text-slate-400 truncate">${u(loc)}</p>
            <span class="inline-block mt-1 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border ${avail ? "text-green-400 bg-green-500/10 border-green-500/20" : "text-yellow-400 bg-yellow-500/10 border-yellow-500/20"}">${avail ? "Available" : "Not Available"}</span>
          </div>
        </a>
        <div class="space-y-1.5 text-xs text-slate-400">
          <p>🩸 <span>Group</span>: <span class="text-red-400 font-bold" translate="no">${escapeHTML(d.bloodGroup || "—")}</span></p>
          <p>📅 <span>Last Donation</span>: <span class="text-slate-300 font-medium">${u(formatDonationDate(d.lastDonationDate))}</span></p>
          ${d.donationCount ? `<p>❤️ <span>Donations</span>: <span class="text-slate-300 font-medium">${window.i18n.fmtNum(Number(d.donationCount) || 0)}</span></p>` : ""}
          ${hidePhone ? `<p>📞 <span>Phone</span>: <span class="text-slate-500">Hidden (Female donor)</span></p>` : ""}
        </div>
        ${action}
        <a href="donor.html?id=${encodeURIComponent(id)}" class="mt-2 block text-center text-xs font-semibold text-slate-400 hover:text-red-400 transition-colors py-1.5">View Profile →</a>
      </div>`;
    }

    function renderDonors(list) {
      lastResults = list;
      const grid = document.getElementById("searchResults");
      grid.innerHTML = list.length ? list.map(donorCard).join("") : emptyStateHTML("No donors found matching your criteria.", null, null);
      revealAll(grid);
    }

    async function runSearch() {
      const blood = document.getElementById("searchBlood").value;
      const district = distSelect.value;
      const upazila = upaSelect.value;
      const availableOnly = document.getElementById("searchAvailable").value === "yes";
      const compat = document.getElementById("searchCompat").checked;
      const btn = document.getElementById("searchBtn");
      const btnText = document.getElementById("searchBtnText");
      const spinner = document.getElementById("searchSpinner");
      const grid = document.getElementById("searchResults");

      btn.disabled = true; btnText.textContent = _("Searching..."); spinner.classList.remove("hidden");
      grid.innerHTML = loadingHTML(3);
      try {
        const fb = await initFirebase();
        if (!fb) { grid.innerHTML = emptyStateHTML("Search failed. Please try again.", null, null); return; }
        const { collection, getDocs, query, where, limit } = await getFirestoreFns();

        const groups = blood === "All" ? null : compat ? COMPATIBLE_DONORS[blood] : [blood];
        const build = (withServer) => {
          const c = [];
          if (withServer) {
            if (groups) c.push(groups.length === 1 ? where("bloodGroup", "==", groups[0]) : where("bloodGroup", "in", groups));
            if (district !== "All") c.push(where("district", "==", district));
            if (upazila !== "All") c.push(where("upazila", "==", upazila));
          }
          c.push(limit(withServer ? 120 : 300));
          return query(collection(fb.db, "publicDonors"), ...c);
        };
        let snap;
        try { snap = await getDocs(build(true)); } catch (e) { console.warn("server filter failed, falling back", e.code); snap = await getDocs(build(false)); }

        let results = [];
        snap.forEach((s) => {
          const d = { id: s.id, ...s.data() };
          if (groups && !groups.includes(d.bloodGroup)) return;
          if (district !== "All" && d.district !== district) return;
          if (upazila !== "All" && d.upazila !== upazila) return;
          if (availableOnly && !(d.available !== false && isDonorAvailable(d.lastDonationDate))) return;
          results.push(d);
        });
        results.sort((a, b) => (isDonorAvailable(b.lastDonationDate) ? 1 : 0) - (isDonorAvailable(a.lastDonationDate) ? 1 : 0));
        renderDonors(results);
      } catch (err) {
        console.error(err);
        grid.innerHTML = emptyStateHTML("Search failed. Please try again.", null, null);
        showToast("Search failed. Please try again.", "error");
      } finally {
        btn.disabled = false; btnText.textContent = _("Search"); spinner.classList.add("hidden");
      }
    }
    document.getElementById("searchBtn").addEventListener("click", runSearch);
    window.addEventListener("langchange", () => { if (lastResults.length) renderDonors(lastResults); });

    // Prefill from URL (?group=A%2B&district=Dhaka) and auto-search
    (function () {
      const p = new URLSearchParams(location.search);
      const g = p.get("group"), dn = p.get("district");
      if (g) document.getElementById("searchBlood").value = g;
      if (dn && [...distSelect.options].some((o) => o.value === dn)) { distSelect.value = dn; fillUpazilas(dn); }
      if (g || dn) { document.getElementById("searchCompat").checked = !!g && !p.get("exact"); runSearch(); }
    })();
  </script>
</body>
</html>
